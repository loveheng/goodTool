name: good_template
description: "goodhub 服务端模板：Android 常驻壳 + 内嵌 MCP 服务端内核。新 app 以此起底，实现端口 + 注册工具面即可上工。"
publish_to: 'none'
version: 0.1.0+34

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # MCP 内核：总控 KV/开关持久化 + 远程配置热更（自 shiguang update_kit 提取）
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  crypto: ^3.0.7

  # 前台服务保活（Doze 下 MCP 应答须持 CPU 键+Wi-Fi 键，拾贝/拾光实测踩坑件）
  flutter_foreground_task: ^11.0.3
  decimal: ^3.2.6

  # 时区归一（calendar.md 时区治理 B 拍板）：纯 Dart，bundled latest.tzf，满足内核不沾 dart:io。
  timezone: ^0.10.0
  # 农历 / 节气引擎（P2-③）：纯 Dart 无第三方依赖，1900–2100 公农历双向换算、生肖、节气。
  lunar: ^1.7.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
